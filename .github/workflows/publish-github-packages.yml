name: publish-github-packages

# Publishes the skill-scan-gate container image to GitHub Packages when a version tag is pushed, using only GITHUB_TOKEN:
#   ghcr.io/basitalisandhu/skill-scan-gate:<version> and :latest (linux/amd64, linux/arm64),
#   with an SPDX SBOM, a build provenance attestation and a keyless cosign signature,
# then creates the GitHub Release for the tag with generated notes and the SBOM attached.
#
# Pull requests that touch the packaging run the same build as a dry run (nothing is pushed).
# workflow_dispatch on a tag publishes like a tag push; on a branch it is a dry run unless "publish" is ticked.
# PyPI publishing lives in release.yml and stays off until the repository variable PYPI_PUBLISH is "true".

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/publish-github-packages.yml"
      - "pyproject.toml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish from a branch (a tag ref always publishes)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-github-packages-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/basitalisandhu/skill-scan-gate
  PUBLISH: ${{ github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      description: ${{ steps.meta.outputs.description }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: python -m pytest -q
      - name: Gate the fixtures
        run: |
          skill-scan-gate scan tests/fixtures/fixture-clean --fail-on low
          set +e
          skill-scan-gate scan tests/fixtures/fixture-planted > /dev/null; test $? -eq 1
      - name: Version (must match the tag) and description
        id: meta
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$VERSION" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error file=pyproject.toml::version $VERSION does not match tag $GITHUB_REF_NAME"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "description=CI gate for Claude Code skills and plugins: scan, write SARIF, fail on findings" >> "$GITHUB_OUTPUT"

  publish-container:
    name: Container image
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.build-test.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          build-args: |
            VERSION=${{ env.VERSION }}
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.title=skill-scan-gate
            org.opencontainers.image.description=${{ needs.build-test.outputs.description }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
          annotations: |
            index:org.opencontainers.image.description=${{ needs.build-test.outputs.description }}
            index:org.opencontainers.image.source=https://github.com/${{ github.repository }}
            index:org.opencontainers.image.licenses=MIT
          # Provenance comes from attest-build-provenance below; keep the image index free of extra manifests.
          provenance: false
          sbom: false
          cache-from: type=gha,scope=skill-scan-gate
          cache-to: type=gha,mode=max,scope=skill-scan-gate
      - name: SBOM (SPDX)
        if: env.PUBLISH == 'true'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: sbom-skill-scan-gate-${{ env.VERSION }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Upload SBOM artifact
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-skill-scan-gate
          path: sbom-skill-scan-gate-${{ env.VERSION }}.spdx.json
          if-no-files-found: error
      - name: Build provenance attestation
        if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: env.PUBLISH == 'true'
      - name: Sign the image (keyless)
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  release:
    name: GitHub Release
    needs: [build-test, publish-container]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sbom-*
          path: sboms
          merge-multiple: true
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l sboms
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" sboms/*.spdx.json --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" sboms/*.spdx.json --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$TAG"
          fi
